services:
  turnback:
    build: .
    container_name: turnback_simulator
    restart: unless-stopped
    ports:
      - "127.0.0.1:8510:8501"
    # CORS and XSRF stay disabled: the public host is a reverse proxy in
    # front of this loopback bind. See REVIEW.md before turning them on.
    command: >
      streamlit run turnback_app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true
      --logger.level=info
      --browser.gatherUsageStats=false
      --server.enableCORS=false
      --server.enableXsrfProtection=false
